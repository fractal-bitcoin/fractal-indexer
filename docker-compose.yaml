services:
   fractal-indexer:
     build: .
     image: fractalbitcoin/fractal-indexer:v0.1
     entrypoint: ./fractal-indexer
     volumes:
       - ./conf:/data/conf:ro
     ports:
       - "6666:8000"
     labels:
       - "name=fractal-indexer"
     logging:
       driver: "json-file"
       options:
         labels: "name"
         max-size: "1g"
         max-file: "3"
