services:
   fractal-query:
     build: .
     image: fractalbitcoin/fractal-query:v0.1
     volumes:
       - ./conf:/data/conf:ro
     ports:
       - "6666:8000"
     restart: always
     environment:
       LISTEN: 0.0.0.0:8000
       BASE_PATH: ""
       INSCRIBE_PUBLIC_KEY_HEX: ""
       COIN_MARKET_CAP_KEY: ""
       POOL_ADDRESS: ""
     labels:
       - "name=fractal-query"
     logging:
       driver: "json-file"
       options:
         labels: "name"
         max-size: "1g"
         max-file: "3"
